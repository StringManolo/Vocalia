name: Android Native CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  create:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # --- NUEVO: Instalar Android NDK ---
      - name: 🧰 Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973' # Una versión estable y reciente del NDK

      # --- NUEVO: Compilar espeak-ng para Android ---
      - name: 🏗️ Build espeak-ng native libraries and data
        run: |
          # 1. Clonar el repositorio de espeak-ng
          git clone --depth 1 https://github.com/espeak-ng/espeak-ng.git /tmp/espeak-ng
          cd /tmp/espeak-ng

          # 2. Compilar las librerías .so con ndk-build
          cd android
          # Asegurar que ndk-build está en el PATH
          export PATH=$ANDROID_HOME/ndk/27.0.12077973:$PATH
          ndk-build
          cd ..

          # 3. Generar espeakdata.zip (el método fiable es usar el script de CI o make)
          #    Según la documentación, se puede usar el propio sistema de build.
          #    Probamos con 'make android' que es el objetivo que genera los datos.
          ./autogen.sh
          ./configure --prefix=/usr
          make android || make espeakdata # Fallback por si el target cambia de nombre

          # 4. Copiar las librerías .so generadas a tu proyecto
          #    ndk-build las deja en android/libs/<ABI>/
          mkdir -p $GITHUB_WORKSPACE/app/src/main/jniLibs
          cp -r android/libs/* $GITHUB_WORKSPACE/app/src/main/jniLibs/

          # 5. Copiar espeakdata.zip a res/raw
          mkdir -p $GITHUB_WORKSPACE/app/src/main/res/raw
          # Buscar el zip generado y copiarlo
          find . -name "espeakdata.zip" -exec cp {} $GITHUB_WORKSPACE/app/src/main/res/raw/espeakdata.zip \;
          echo "✅ Librerías .so y espeakdata.zip generados desde el código fuente."

      - name: 🏗️ Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 📦 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: 🔐 Config APK Signature
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          KEYSTORE_PATH=$RUNNER_TEMP/release.jks
          echo "$KEYSTORE_BASE64" | base64 -d > $KEYSTORE_PATH
          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: 🎯 Build Release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: gradle assembleRelease --stacktrace

      - name: 📦 Upload Release APK Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: 🚀 Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
