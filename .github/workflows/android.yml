name: Android Native CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  create:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 🧰 Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973'

      # --- NUEVO: Compilar espeak-ng y extraer artefactos ---
      - name: 🏗️ Build espeak-ng and extract artifacts
        run: |
          set -e

          # 1. Clonar el repositorio de espeak-ng
          git clone --depth 1 https://github.com/espeak-ng/espeak-ng.git /tmp/espeak-ng

          # 2. Compilar la APK de espeak-ng con su propio Gradle
          cd /tmp/espeak-ng/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

          APK_PATH=$(find /tmp/espeak-ng/android -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ No se encontró el APK de espeak-ng"
            exit 1
          fi
          echo "APK encontrada en: $APK_PATH"

          # 3. Extraer todo el contenido del APK
          mkdir -p /tmp/espeak_extract
          unzip -o "$APK_PATH" -d /tmp/espeak_extract

          # 4. Copiar libttsespeak.so para cada ABI disponible
          mkdir -p $GITHUB_WORKSPACE/app/src/main/jniLibs
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            if [ -f "/tmp/espeak_extract/lib/$abi/libttsespeak.so" ]; then
              mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/$abi"
              cp "/tmp/espeak_extract/lib/$abi/libttsespeak.so" \
                 "$GITHUB_WORKSPACE/app/src/main/jniLibs/$abi/"
              echo "✅ .so copiado para $abi"
            fi
          done

          # 5. Copiar espeakdata.zip del APK, o generarlo si no está
          mkdir -p $GITHUB_WORKSPACE/app/src/main/res/raw
          if [ -f "/tmp/espeak_extract/res/raw/espeakdata.zip" ]; then
            cp "/tmp/espeak_extract/res/raw/espeakdata.zip" \
               "$GITHUB_WORKSPACE/app/src/main/res/raw/espeakdata.zip"
            echo "✅ espeakdata.zip extraído del APK"
          else
            echo "⚠️ espeakdata.zip no está en el APK. Generando desde el código fuente..."
            cd /tmp/espeak-ng
            sudo apt-get update
            sudo apt-get install -y autoconf automake libtool pkg-config build-essential
            ./autogen.sh
            ./configure --prefix=/usr
            make espeakdata || make android || make dist || true

            ESPEAKDATA_PATH=$(find /tmp/espeak-ng -name "espeakdata.zip" -type f | head -n 1)
            if [ -z "$ESPEAKDATA_PATH" ]; then
              echo "❌ No se pudo generar espeakdata.zip por ningún método"
              exit 1
            fi
            cp "$ESPEAKDATA_PATH" $GITHUB_WORKSPACE/app/src/main/res/raw/espeakdata.zip
            echo "✅ espeakdata.zip generado desde $ESPEAKDATA_PATH"
          fi

          # 6. Verificación final
          echo "=== jniLibs ==="
          ls -la $GITHUB_WORKSPACE/app/src/main/jniLibs/*/
          echo "=== res/raw ==="
          ls -la $GITHUB_WORKSPACE/app/src/main/res/raw/

      - name: 🏗️ Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 📦 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: 🔐 Config APK Signature
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          KEYSTORE_PATH=$RUNNER_TEMP/release.jks
          echo "$KEYSTORE_BASE64" | base64 -d > $KEYSTORE_PATH
          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: 🎯 Build Release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: gradle assembleRelease --stacktrace

      - name: 📦 Upload Release APK Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: 🚀 Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
